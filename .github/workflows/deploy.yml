name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Teg image for deploy"
        required: false
        default: latest
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        # ghcr.io требует lowercase, а github.repository/GITHUB_REPOSITORY
        # сохраняют регистр владельца/репозитория как в URL (SharpCDNK/devops-lab)
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # known_hosts вместо StrictHostKeyChecking=no: защита от MITM
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy new image
        env:
          HOST: ${{ vars.SERVER_HOST }}
          USER: ${{ vars.SERVER_USER }}
          TAG: ${{ github.event.inputs.image_tag || github.sha }}
          IMAGE: ${{ env.IMAGE_NAME_LC }}
        run: |
          HOST="${{ vars.SERVER_HOST }}"
          USER="${{ vars.SERVER_USER }}"
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          IMAGE="${{ env.IMAGE_NAME_LC }}"
          ssh -i ~/.ssh/id_ed25519 "${USER}@${HOST}" bash -s <<EOSSH
          set -euo pipefail
          cd /opt/devops-lab
          CURRENT=\$(grep '^IMAGE=' .env | cut -d= -f2-)
          echo "\$CURRENT" > .previous_image
          echo "current image: \$CURRENT"
          NEW="ghcr.io/${IMAGE}:${TAG}"
          sed -i "s|^IMAGE=.*|IMAGE=\${NEW}|" .env
          echo "deploying: \$NEW"
          docker compose pull app
          docker compose up -d app
          EOSSH
      - name: Smoke test
        run: |
          sleep 10
          bash scripts/smoke-test.sh "http://${{ vars.SERVER_HOST }}"
      - name: Rollback on failure
        if: failure()
        env:
          HOST: ${{ vars.SERVER_HOST }}
          USER: ${{ vars.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${USER}@${HOST}" bash -s <<'EOSSH'
          set -euo pipefail
          cd /opt/devops-lab
          PREV=$(cat .previous_image)
          echo "rolling back to $PREV"
          sed -i "s|^IMAGE=.*|IMAGE=${PREV}|" .env
          docker compose up -d app
          EOSSH
          echo "Rotate to previus image"
