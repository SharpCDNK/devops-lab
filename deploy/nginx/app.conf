# HTTP: отдаём ACME-челлендж и редиректим всё остальное на HTTPS.
# Пока сертификата нет — закомментируй редирект и оставь proxy_pass в этом блоке.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- ВРЕМЕННО, пока нет домена и сертификата: работаем по http ---
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- После выпуска сертификата: удалить блок выше и раскомментировать ---
    # location / { return 301 https://$host$request_uri; }
}

